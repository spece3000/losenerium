<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOSENERIUM - Личный кабинет</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cm-chessboard@8/assets/chessboard.css">
    <link rel="stylesheet" href="style.css">
    <script defer src="clientProf.js"></script>
</head>
<body>
    <header class="header header-profile">
        <a href="index.html" class="containerLogo">
            <img class="imgLogo" src="img/coffee-icon-logo.png" alt="лого">
            <h1 class="textLogo">LOSENERIUM</h1>
        </a>
    </header>

    <main>
        <section class="profile-section">
            <div class="profile-left">
                <div class="profile-header">
                    <h2 id="prof-name">Ваше имя</h2>
                    <div class="profile-data">
                        <p id="prof-address">адрес: </p>
                        <p id="prof-email">почта: </p>
                    </div>
                </div>
                <div class="profile-buttons">
                    <button id="logoutBtn">выйти</button>
                    <button id="deleteBtn">удалить</button>
                </div>
            </div>
            <div class="profile-orders">
                <h3>ваши<br>заказы</h3>
            </div>
        </section>

        <section class="cart-section">

            <div class="cart-actions">
                <button class="btn-clear">очистить</button>
                <p class="cart-total">0р.</p>
                <button class="btn-buy">купить</button>
            </div>
        </section>

        <h2 id="menuHeadline">меню</h2>
        <section class="menu">
            <div class="menuManipulate">
                <select class="choice_sort">
                    <option value="normal">стандарт</option>
                    <option value="up_price">по возрастанию</option>
                    <option value="down_price">по убыванию</option>
                </select>
                <div class="paginathion">
                    <button class="pagButton">1</button>
                    <button class="pagButton">2</button>
                    <button class="pagButton">3</button>
                </div>
                <div class="query">
                    <div class="querys_three">
                        <div class="query_three"></div><div class="query_three"></div><div class="query_three"></div>
                        <div class="query_three"></div><div class="query_three"></div><div class="query_three"></div>
                        <div class="query_three"></div><div class="query_three"></div><div class="query_three"></div>
                    </div>
                    <div class="querys_four">
                        <div class="query_four"></div><div class="query_four"></div><div class="query_four"></div><div class="query_four"></div>
                        <div class="query_four"></div><div class="query_four"></div><div class="query_four"></div><div class="query_four"></div>
                        <div class="query_four"></div><div class="query_four"></div><div class="query_four"></div><div class="query_four"></div>
                        <div class="query_four"></div><div class="query_four"></div><div class="query_four"></div><div class="query_four"></div>
                    </div>
                </div>
            </div>
            <div class="menuContain"></div>
        </section>
    </main>

    <footer class="footer">
        <a class="num" href="tel:89999999999">89999999999</a>
        <a href="mailto:LR@gmail.com">LR@gmail.com</a>
        <div class="socialMediaContain">
            <a href=""><img src="img/tg.png" alt="лого телеграмм"></a>
            <a href=""><img src="img/tt.png" alt="лого тик тока"></a>
            <a href=""><img src="img/wk.png" alt="лого вк"></a>
        </div>
    </footer>
</body>
</html>
